<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">
        <i class="bi bi-lightning-charge-fill"></i>
      </div>
      <h1 class="auth-title">Resiste</h1>
      <p class="auth-subtitle">Inicia sesión para continuar tu entrenamiento</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope-fill input-icon"></i>
          <input
            id="email"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            placeholder="ejemplo@correo.com"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i class="bi bi-shield-lock-fill input-icon"></i>
          <input
            id="password"
            type="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) {
          <i class="bi bi-arrow-repeat spin"></i>
          <span>Iniciando sesión...</span>
        } @else {
          <i class="bi bi-box-arrow-in-right"></i>
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding: 1rem; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.15); border-radius: 0.75rem; text-align: center;">
      <p style="font-size: 0.8rem; color: #94a3b8; margin: 0 0 0.5rem; font-weight: 600;">
        <i class="bi bi-person-badge-fill" style="color: #fbbf24;"></i> Cuentas Demo de Prueba:
      </p>
      <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
        <button type="button" (click)="fillDemo('demo@resiste.com')" style="background: rgba(56,189,248,0.12); color: #38bdf8; border: 1px solid rgba(56,189,248,0.25); border-radius: 0.4rem; padding: 0.3rem 0.6rem; font-size: 0.75rem; cursor: pointer;">
          demo&#64;resiste.com
        </button>
        <button type="button" (click)="fillDemo('eri@resiste.com')" style="background: rgba(167,139,250,0.12); color: #a78bfa; border: 1px solid rgba(167,139,250,0.25); border-radius: 0.4rem; padding: 0.3rem 0.6rem; font-size: 0.75rem; cursor: pointer;">
          eri&#64;resiste.com
        </button>
        <button type="button" (click)="fillDemo('jhon@resiste.com')" style="background: rgba(52,211,153,0.12); color: #34d399; border: 1px solid rgba(52,211,153,0.25); border-radius: 0.4rem; padding: 0.3rem 0.6rem; font-size: 0.75rem; cursor: pointer;">
          jhon&#64;resiste.com
        </button>
      </div>
      <p style="font-size: 0.7rem; color: #64748b; margin: 0.4rem 0 0;">Contraseña por defecto: <code>password123</code></p>
    </div>

    <div class="auth-footer">
      <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí <i class="bi bi-arrow-right"></i></a></p>
    </div>
  </div>
</div>
