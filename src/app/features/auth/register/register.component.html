<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h1 class="auth-title">Únete a Resiste</h1>
      <p class="auth-subtitle">Crea tu cuenta y empieza a registrar tus metas</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="alert alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span>{{ successMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <div class="input-wrapper">
          <i class="bi bi-person-fill input-icon"></i>
          <input
            id="nombre"
            type="text"
            [ngModel]="nombre()"
            (ngModelChange)="nombre.set($event)"
            name="nombre"
            placeholder="Juan Pérez"
            required
            autocomplete="name"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope-fill input-icon"></i>
          <input
            id="email"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            placeholder="ejemplo@correo.com"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña (mínimo 6 caracteres)</label>
        <div class="input-wrapper">
          <i class="bi bi-shield-lock-fill input-icon"></i>
          <input
            id="password"
            type="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          />
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) {
          <i class="bi bi-arrow-repeat spin"></i>
          <span>Creando cuenta...</span>
        } @else {
          <i class="bi bi-check2-circle"></i>
          <span>Registrarse</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes una cuenta? <a routerLink="/login"><i class="bi bi-arrow-left"></i> Inicia sesión</a></p>
    </div>
  </div>
</div>
